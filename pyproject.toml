[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zahn"
version = "0.1.0"
description = "Dental lab sentiment analysis worker using LLM-based classification"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-env>=1.1",
    "pytest-timeout>=2.3",
]

[project.scripts]
zahn-worker = "zahn.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zahn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
markers = ["integration: requires running PostgreSQL and Ollama"]
env = [
    "OLLAMA_BASE_URL=http://localhost:11434",
    "OLLAMA_MODEL=llama3.2:3b",
]
